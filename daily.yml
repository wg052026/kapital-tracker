name: KAPITAL Tracker - Auto Update

on:
  schedule:
    # 모든 cron은 UTC 기준. 주석은 KST(UTC+9).
    # ── 07:00~14:00 KST: 매시간 ──
    - cron: '0 22 * * *'   # 07:00 KST
    - cron: '0 23 * * *'   # 08:00 KST
    - cron: '0 0 * * *'    # 09:00 KST
    - cron: '0 1 * * *'    # 10:00 KST
    - cron: '0 2 * * *'    # 11:00 KST
    - cron: '0 3 * * *'    # 12:00 KST
    - cron: '0 4 * * *'    # 13:00 KST
    - cron: '0 5 * * *'    # 14:00 KST
    # ── 15:00~18:50 KST: 10분 간격 (피크 시간) ──
    - cron: '0,10,20,30,40,50 6 * * *'   # 15:xx KST
    - cron: '0,10,20,30,40,50 7 * * *'   # 16:xx KST
    - cron: '0,10,20,30,40,50 8 * * *'   # 17:xx KST
    - cron: '0,10,20,30,40,50 9 * * *'   # 18:xx KST
    # ── 19:00~24:00 KST: 매시간 ──
    - cron: '0 10 * * *'   # 19:00 KST
    - cron: '0 11 * * *'   # 20:00 KST
    - cron: '0 12 * * *'   # 21:00 KST
    - cron: '0 13 * * *'   # 22:00 KST
    - cron: '0 14 * * *'   # 23:00 KST
    - cron: '0 15 * * *'   # 24:00 (00:00) KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chrome 캐시 복원
        uses: actions/cache@v4
        id: chrome-cache
        with:
          path: /usr/bin/google-chrome-stable
          key: chrome-${{ runner.os }}-v1

      - name: Chrome 설치
        if: steps.chrome-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q google-chrome-stable

      - name: pip 캐시 복원
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-selenium-${{ runner.os }}-v1

      - name: Python 패키지 설치
        run: pip install selenium webdriver-manager

      - name: 크롤링 실행
        run: python scraper.py

      - name: 메일 본문 생성 (NEW 상품 확인)
        id: email
        run: python build_email.py

      - name: 신상품 메일 발송
        if: steps.email.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.naver.com
          server_port: 465
          secure: true
          username: ${{ secrets.NAVER_USER }}
          password: ${{ secrets.NAVER_PASS }}
          from: KAPITAL Tracker <${{ secrets.NAVER_USER }}@naver.com>
          to: ${{ secrets.NAVER_USER }}@naver.com
          subject: "[KAPITAL] 신상품 ${{ steps.email.outputs.count }}개 입고"
          html_body: file://email_body.html
          convert_markdown: false

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "kapital-bot"
          git config user.email "bot@kapital-tracker"
          git add docs/index.html docs/date_cache.json docs/prev_items.json docs/tf_price_cache.json docs/kerouac_code_cache.json docs/new_items.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "auto update $(date '+%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git fetch origin main
          git rebase origin/main
          git push origin main
