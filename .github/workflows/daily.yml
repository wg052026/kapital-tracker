name: KAPITAL Tracker - Auto Update

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0,10,20,30,40,50 6 * * *'
    - cron: '0,10,20,30,40,50 7 * * *'
    - cron: '0,10,20,30,40,50 8 * * *'
    - cron: '0,10,20,30,40,50 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chrome 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q google-chrome-stable
          pip install selenium webdriver-manager

      - name: 크롤링 실행
        run: python scraper.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "kapital-bot"
          git config user.email "bot@kapital-tracker"
          git add docs/index.html docs/date_cache.json docs/prev_items.json docs/kream_cache.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "auto update $(date '+%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git fetch origin main
          git rebase origin/main
          git push origin main
