name: KAPITAL Tracker - Daily Update

on:
  schedule:
    # 매 2시간마다 실행 (KST 기준: 01,03,05,07,09,11,13,15,17,19,21,23시)
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scraper.py
      - run: |
          git config user.name "kapital-bot"
          git config user.email "bot@kapital-tracker"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "auto update $(date '+%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git push
