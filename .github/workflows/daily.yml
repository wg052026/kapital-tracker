name: KAPITAL Tracker - Auto Update

on:
  schedule:
    # 모든 cron은 UTC 기준. 주석은 KST(UTC+9).
    # ※ 피크 시간(새벽 3~7시, 오후 5~7시 KST)은 cron-job.org가 3분마다 단독 담당.
    #    겹침(동시 실행 → prev_items 꼬임)을 막기 위해 그 시간대는 여기서 제외.
    # ── 08:00~16:00 KST: 매시간 (보조) ──
    - cron: '0 23 * * *'   # 08:00 KST
    - cron: '0 0 * * *'    # 09:00 KST
    - cron: '0 1 * * *'    # 10:00 KST
    - cron: '0 2 * * *'    # 11:00 KST
    - cron: '0 3 * * *'    # 12:00 KST
    - cron: '0 4 * * *'    # 13:00 KST
    - cron: '0 5 * * *'    # 14:00 KST
    - cron: '0 6 * * *'    # 15:00 KST
    - cron: '0 7 * * *'    # 16:00 KST
    # ── 20:00~02:00 KST: 매시간 (보조) ──
    - cron: '0 11 * * *'   # 20:00 KST
    - cron: '0 12 * * *'   # 21:00 KST
    - cron: '0 13 * * *'   # 22:00 KST
    - cron: '0 14 * * *'   # 23:00 KST
    - cron: '0 15 * * *'   # 24:00 (00:00) KST
    - cron: '0 16 * * *'   # 01:00 KST
    - cron: '0 17 * * *'   # 02:00 KST
  workflow_dispatch:
    inputs:
      test_email:
        description: '테스트 메일 보내기 (체크하면 신상품 없어도 메일 발송)'
        type: boolean
        default: false

permissions:
  contents: write

# 동시 실행 방지(보조 안전장치): 같은 그룹은 한 번에 하나만 실행.
# 겹치면 진행 중인 건 끝까지 두고 새 실행은 대기. (주 트리거 겹침은 위 스케줄 정리로 해결)
concurrency:
  group: kapital-update
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chrome 캐시 복원
        uses: actions/cache@v4
        id: chrome-cache
        with:
          path: /usr/bin/google-chrome-stable
          key: chrome-${{ runner.os }}-v1

      - name: Chrome 설치
        if: steps.chrome-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q google-chrome-stable

      - name: 낡은 chromedriver 제거 (Selenium Manager가 Chrome 버전에 맞게 자동 설치)
        run: |
          sudo rm -f /usr/bin/chromedriver /usr/local/bin/chromedriver || true
          echo "removed stale chromedriver from PATH"

      - name: pip 캐시 복원
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-selenium-${{ runner.os }}-v1

      - name: Python 패키지 설치
        run: pip install selenium webdriver-manager

      - name: 크롤링 실행
        run: python scraper.py

      - name: 메일 본문 생성 (NEW 상품 확인)
        id: email
        env:
          TEST_EMAIL: ${{ github.event.inputs.test_email == 'true' && '1' || '0' }}
        run: python build_email.py

      - name: 신상품 메일 발송
        if: steps.email.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.naver.com
          server_port: 587
          secure: false
          username: wkele2k@naver.com
          password: ${{ secrets.NAVER_PASS }}
          from: ${{ steps.email.outputs.has_ch == 'true' && 'CHROME HEARTS Tracker <wkele2k@naver.com>' || 'KAPITAL Tracker <wkele2k@naver.com>' }}
          to: wkele2k@naver.com
          subject: ${{ steps.email.outputs.has_ch == 'true' && format('[🔥CHROME HEARTS] 신상품 {0}개 입고', steps.email.outputs.count) || format('[KAPITAL] 신상품 {0}개 입고', steps.email.outputs.count) }}
          html_body: file://email_body.html
          convert_markdown: false

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "kapital-bot"
          git config user.email "bot@kapital-tracker"
          FILES="docs/index.html docs/date_cache.json docs/prev_items.json docs/tf_price_cache.json docs/kerouac_code_cache.json docs/new_items.json docs/ch_categories.json"
          # 생성된 파일을 안전한 곳에 백업 (충돌과 무관하게 보존)
          mkdir -p /tmp/out
          for f in $FILES; do
            [ -f "$f" ] && cp "$f" "/tmp/out/$(echo $f | tr '/' '_')"
          done
          # 동시 실행 충돌 대비: 최대 8회 재시도. 항상 내 결과(최신 크롤링) 우선.
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main          # 원격 최신으로 맞춤
            # 백업해둔 내 파일을 다시 덮어쓰기
            for f in $FILES; do
              b="/tmp/out/$(echo $f | tr '/' '_')"
              [ -f "$b" ] && cp "$b" "$f"
            done
            git add $FILES 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "변경 없음 (원격과 동일)" && exit 0
            fi
            git commit -m "auto update $(date '+%Y-%m-%d %H:%M KST' -d '+9 hours')"
            if git push origin main; then
              echo "푸시 성공 (시도 $i)"
              exit 0
            fi
            echo "푸시 충돌, 재시도 $i..."
            sleep $((RANDOM % 8 + 2))
          done
          echo "8회 시도 후에도 푸시 실패" && exit 1
